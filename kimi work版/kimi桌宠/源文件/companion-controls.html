(()=>{'use strict';const host=window.DaimonWidget,panel=document.getElementById('kc-panel'),chatter=document.getElementById('kc-chatter');if(!panel||!chatter)return;
const KEY='kimi-work-companion.settings.v1';let settings={animation:true,chats:false,chatterConfigured:false,rotation:true,scale:120,sizeAdjusted:false};if(!settings.chatterConfigured){settings.chats=false;settings.chatterConfigured=true;try{localStorage.setItem(KEY,JSON.stringify(settings))}catch{}}try{settings={...settings,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{}
let lang='en',status={conversations:[],activeConversationId:null},open=false,chatterTimer=0,hideTimer=0,lastMode='',metrics={};
const copy={zh:{title:'Kimi 的小桌台',settings:'设置',monitor:'监控',close:'关闭',animation:'播放动画',chats:'Coding 碎碎念',rotation:'自动轮换待机',petSize:'桌宠大小',preview:'场景预览',reading:'☾ 月下阅读',rock:'♫ 摇滚听歌',tea:'♡ 与 GLM 递茶',piano:'♬ 古典钢琴',context:'上下文长度',quota:'剩余额度',compactions:'压缩次数',steps:'轮次 / 步数',speed:'Token 速度',unavailable:'未接入',refresh:'刷新当前数据',refreshing:'正在刷新…',metricNote:'来源：当前会话日志与官方额度接口',updated:'更新于 {time}',refreshFailed:'刷新失败，已保留上次结果',foot:'点击 Kimi 开合面板 · 拖拽仍可移动',idle:'空闲',working:'Coding 进行中',failed:'运行失败',none:'当前没有运行中的会话',active:'{n} 个会话运行中',open:'打开“{title}”',lines:['今天也陪你呀。','喝口水，歇一下嘛。','我在认真弹琴哦。','慢慢来，我陪着你。','这一小段快好了。','要听我弹首曲子吗？'],workLines:['我在认真弹琴哦。','交给我，马上好。','一点点把它做好。'],doneLines:['做好啦，快看看。','演出完毕，还不错吧？'],failLines:['好像卡了一下。','别急，我们再看看。']},en:{title:"Kimi's little desk",settings:'Settings',monitor:'Monitor',close:'Close',animation:'Play animation',chats:'Coding chatter',rotation:'Rotate idle scenes',petSize:'Pet size',preview:'Scene preview',reading:'☾ Moonlit reading',rock:'♫ Rock music',tea:'♡ Tea with GLM',piano:'♬ Classical piano',context:'Context length',quota:'Remaining quota',compactions:'Compactions',steps:'Turns / steps',speed:'Token speed',unavailable:'Not connected',refresh:'Refresh current data',refreshing:'Refreshing…',metricNote:'Sources: current session log and official quota API',updated:'Updated {time}',refreshFailed:'Refresh failed; previous values kept',foot:'Click Kimi to toggle · Drag to move',idle:'Idle',working:'Coding in progress',failed:'Run failed',none:'No conversations are running',active:'{n} conversation(s) running',open:'Open “{title}”',lines:['I’m here with you.','A little water break?','Slow and steady.','I’m playing for you.','Almost through this bit.'],workLines:['Let me handle this.','Playing while I work.','Making it just right.'],doneLines:['All done, take a look!','A neat little finish.'],failLines:['That hit a snag.','Let’s take another look.']}};

  cacheHit: '缓存命中率', loadedSkills: '已加载技能', tools: '工具调用',
  cacheDetails: '最近 {samples} 次调用 · 命中 {hit} / {input} Token', noCache: '暂无缓存用量',

});

  cacheDetails: 'Last {samples} calls · {hit} / {input} cached tokens', noCache: 'No cache data yet',
  skillCount: '{count} loaded', toolScope: 'This turn / session total', activeTools: 'Running: {names}', noActiveTools: 'No running tools'
});
function t(){return copy[lang]||copy.en}function fmt(s,o){return s.replace(/\{(\w+)\}/g,(_,k)=>o[k])}function localize(value){lang=String(value||'').toLowerCase().startsWith('zh')?'zh':'en';document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.querySelectorAll('[data-kc]').forEach(el=>el.textContent=t()[el.dataset.kc]||el.textContent);document.getElementById('kc-close').setAttribute('aria-label',t().close);panel.setAttribute('aria-label',t().title);renderStatus();renderMetrics()}
function renderExtendedMetrics() {
  const number = new Intl.NumberFormat(lang === 'zh' ? 'zh-CN' : 'en-US');
  const separator = lang === 'zh' ? '、' : ', ';
  const set = (name, value, title = '') => {
    const field = document.querySelector(`[data-metric="${name}"]`);
    field.textContent = value;
    field.title = title;
  };

  const cache = metrics.cacheHit;
  if (Number.isFinite(cache?.percent)) {
    const details = fmt(t().cacheDetails, {
      samples: number.format(cache.samples), hit: number.format(cache.hitTokens), input: number.format(cache.inputTokens)
    });
    set('cacheHit', `${cache.percent.toFixed(1)}%`, details);
  } else set('cacheHit', cache ? t().noCache : t().unavailable);

  const skills = metrics.loadedSkills?.names;
  if (Array.isArray(skills)) {
    const names = skills.join(separator);
    const count = fmt(t().skillCount, { count: number.format(skills.length) });
    set('loadedSkills', names ? `${count} · ${names}` : count, names);
  } else set('loadedSkills', t().unavailable);

  const tools = metrics.tools;
  if (Number.isFinite(tools?.turnCalls) && Number.isFinite(tools.totalCalls)) {
    const names = Array.isArray(tools.activeNames) ? tools.activeNames.join(separator) : '';
    const active = names ? fmt(t().activeTools, { names }) : '';
    const count = `${number.format(tools.turnCalls)} / ${number.format(tools.totalCalls)}`;
    set('tools', active ? `${count} · ${active}` : count, `${t().toolScope} · ${active || t().noActiveTools}`);
  } else set('tools', t().unavailable);
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(settings))}catch{}}
function showChatter(line){if(!settings.chats||!line)return;clearTimeout(hideTimer);chatter.textContent=line;chatter.dataset.show='true';hideTimer=setTimeout(()=>chatter.dataset.show='false',4800)}

function setOpen(value){open=value;panel.hidden=!open;document.body.classList.toggle('kc-controls-open',open);if(open){chatter.dataset.show='false';switchPage('monitor');if(!refreshing)refreshButton.onclick()}else chatter.dataset.show='false';requestAnimationFrame(()=>window.dispatchEvent(new Event('resize')))}
function switchPage(name){const mon=name==='monitor';document.getElementById('kc-page-settings').hidden=mon;document.getElementById('kc-page-monitor').hidden=!mon;document.getElementById('kc-tab-settings').setAttribute('aria-selected',String(!mon));document.getElementById('kc-tab-monitor').setAttribute('aria-selected',String(mon));window.dispatchEvent(new Event('resize'))}
document.getElementById('kc-launcher').onclick=e=>{e.stopPropagation();setOpen(!open)};document.getElementById('kc-close').onclick=()=>setOpen(false);document.getElementById('kc-tab-settings').onclick=()=>switchPage('settings');document.getElementById('kc-tab-monitor').onclick=()=>switchPage('monitor');
const sizeSlider=document.getElementById('kc-size'),sizeValue=document.getElementById('kc-size-value'),petCanvas=document.getElementById('pet-three');const applyPetSize=()=>{if(!settings.sizeAdjusted){settings.scale=120;settings.sizeAdjusted=true;save()}const value=Math.max(60,Math.min(140,Number(settings.scale)||120));settings.scale=value;sizeSlider.value=String(value);sizeValue.textContent=value+'%';sizeSlider.setAttribute('aria-valuetext',value+'%');petCanvas.style.setProperty('width','256px','important');petCanvas.style.setProperty('height','256px','important');petCanvas.style.setProperty('transform-origin','50% 100%','important');petCanvas.style.setProperty('transform','translateX(-50%) scale('+(value/100)+')','important');window.dispatchEvent(new Event('resize'))};sizeSlider.oninput=()=>{settings.scale=Number(sizeSlider.value);settings.sizeAdjusted=true;applyPetSize();save()};applyPetSize();

document.querySelectorAll('[data-scene]').forEach(el=>el.onclick=()=>{const runtime=window.KimiCompanion;if(el.disabled||!runtime)return;if(el.dataset.scene==='piano')void runtime.previewPiano();else void runtime.preview(el.dataset.scene);setOpen(false)});
document.addEventListener('kimi-companion:state',e=>{const mode=e.detail.mode;if(mode===lastMode)return;lastMode=mode;if(mode==='working')showChatter(pick(t().workLines));renderStatus()});
let refreshing=false,refreshTimer=0,lastData={};const refreshButton=document.getElementById('kc-refresh');const renderQuotaBars=()=>{const box=document.getElementById('kc-quota-bars'),quota=metrics?.quota,windows=quota?.windows||{},items=[['limit_5h',lang==='zh'?'5 小时':'5 hours'],['limit_month_total',lang==='zh'?'月度总额':'Monthly total'],['limit_month_code',lang==='zh'?'月度 Coding':'Monthly Coding']].filter(([key])=>Number.isFinite(windows[key]?.remainingPercent));box.replaceChildren();if(!items.length){const text=document.createElement('strong');text.dataset.metric='quota';text.textContent=quota?.display||t().unavailable;box.append(text);return}for(const [key,label]of items){const value=Math.max(0,Math.min(100,windows[key].remainingPercent)),row=document.createElement('div'),name=document.createElement('span'),number=document.createElement('b'),track=document.createElement('div'),fill=document.createElement('i');row.className='kc-quota-row';name.textContent=label;number.textContent=value.toFixed(1)+'%';track.className='kc-quota-track';track.setAttribute('role','progressbar');track.setAttribute('aria-label',label);track.setAttribute('aria-valuemin','0');track.setAttribute('aria-valuemax','100');track.setAttribute('aria-valuenow',String(value));fill.className='kc-quota-fill';fill.style.width=value+'%';fill.dataset.low=String(value<20);track.append(fill);row.append(name,number,track);box.append(row)}};const renderMetrics=()=>{renderExtendedMetrics();Object.entries({context:'context',compactions:'compactions',steps:'steps',speed:'speed'}).forEach(([k,id])=>{const v=metrics?.[k];document.querySelector(`[data-metric="${id}"]`).textContent=v===null||v===undefined||v===''?t().unavailable:typeof v==='object'?(v.display??t().unavailable):String(v)});if(lastData.asOf)document.getElementById('kc-updated').textContent=fmt(t().updated,{time:new Date(lastData.asOf).toLocaleString(lang==='zh'?'zh-CN':'en-US')});refreshButton.textContent=refreshing?t().refreshing:t().refresh;renderQuotaBars()};refreshButton.onclick=()=>{if(refreshing)return;refreshing=true;refreshButton.disabled=true;renderMetrics();host?.emit?.('submit',{action:'refreshMetrics'});clearTimeout(refreshTimer);refreshTimer=setTimeout(()=>{refreshing=false;refreshButton.disabled=false;document.getElementById('kc-updated').textContent=t().refreshFailed;renderMetrics()},30000)};host?.onDataChange?.(d=>{lastData=d?.main||{};metrics=lastData.metrics&&typeof lastData.metrics==='object'?lastData.metrics:{};refreshing=false;refreshButton.disabled=false;clearTimeout(refreshTimer);renderMetrics()});
const onStatus=s=>{const previous=new Set(status.conversations.filter(c=>c.runState==='running').map(c=>c.id));status=s&&Array.isArray(s.conversations)?s:{conversations:[]};const now=status.conversations.some(c=>c.runState==='running');if(previous.size&&!now)showChatter(pick(status.conversations.some(c=>c.runState==='failed'&&previous.has(c.id))?t().failLines:t().doneLines));renderStatus()};host?.conversations?.onStatusChange?.(onStatus);if(host?.conversations?.status)onStatus(host.conversations.status);host?.onLocaleChange?.(localize);localize(host?.locale||document.documentElement.lang||'en-US');schedule();requestAnimationFrame(()=>window.dispatchEvent(new Event('resize')));
window.KimiCompanionTest={getSettings:()=>({...settings}),getStatus:()=>status,getMetrics:()=>metrics,setOpen,showChatter};
})();
